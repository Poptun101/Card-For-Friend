function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildAlbumHTML(media){
if(!media || !media.length) return '<div class="album-empty">No photos or videos added.</div>';
let h = '<div class="album-grid">';
media.forEach((m,i) => {
if(m.type === 'photo'){ h += '<button class="tile" data-i="'+i+'" aria-label="Photo '+(i+1)+'"><img src="'+m.src+'" alt="Photo" loading="lazy"></button>'; }
else { h += '<button class="tile" data-i="'+i+'" aria-label="Video '+(i+1)+'"><video src="'+m.src+'#t=0.1" muted playsinline preload="metadata"></video><span class="play">▶</span></button>'; }
});
return h + '</div>';
}

function buildGuestbookHTML(gb){
if(!gb || !gb.length) return '';
let h = '<h4 class="gb-head">Notes from your people</h4>';
gb.forEach(g => { h += '<div class="gb-note"><p class="t">'+escapeHtml(g.msg)+'</p><span class="n">— '+escapeHtml(g.name || 'a friend')+'</span></div>'; });
return h;
}

function renderCard(){
const c = window.CARD;
const T = (window.__THEMES && window.__THEMES[c.theme]) || null;

const hasMedia = c.media && c.media.length;

stage.innerHTML =
'<div class="inside"><div class="pager">'
+ '<div class="page page-note">'
+ '<p class="greet">'+escapeHtml(c.greeting || 'Happy Birthday')+'</p>'
+ '<h2 class="greet-name">'+escapeHtml(c.name || '')+'</h2>'
+ '<div class="rule"></div>'
+ '<p class="msg">'+escapeHtml(c.message || '')+'</p>'
+ (c.from ? '<p class="from">'+escapeHtml(c.from)+'</p>' : '')

+ (hasMedia ? '<button class="flip-btn" data-flip="album">📸 Photos &amp; videos ('+c.media.length+') →</button>' : '')
+ '</div>'
+ '<div class="page page-album">'
+ '<h3 class="album-head">Photos &amp; videos</h3>'
+ buildAlbumHTML(c.media)
+ '<button class="flip-btn ghost" data-flip="note">← Back to the note</button>'
+ '</div>'
+ '</div></div>'
+ '<div class="coverwrap"><div class="cover">'
+ '<div class="cover-face cover-front">'
+ '<div class="sparkles"></div>'
+ '<div class="cover-eyebrow">A card for you</div>'
+ '<div class="cover-for">'+escapeHtml(c.subtitle || 'Hey')+'</div>'
+ '<div class="cover-name">'+escapeHtml(c.name || '')+'</div>'
+ '<div class="seal" role="button" tabindex="0" aria-label="Open card"><span class="heart">'+escapeHtml(c.seal || '♥')+'</span><small>Open</small></div>'
+ '<div class="tap-hint">tap to open</div>'
+ '</div>'
+ '<div class="cover-face cover-back"></div>'
+ '</div></div>';
root.appendChild(stage);

const spk = stage.querySelector('.sparkles');
const chars = ['✦','✧','✶','·','✦'];
for(let i=0;i<10;i++){
const s = document.createElement('span');
s.textContent = chars[i%chars.length];
s.style.left = (8 + Math.random()*84) + '%'; s.style.top = (8 + Math.random()*84) + '%';
s.style.animationDelay = (Math.random()*3) + 's'; s.style.fontSize = (9 + Math.random()*10) + 'px';
spk.appendChild(s);
}

const open = () => {
if(stage.classList.contains('open')) return;
stage.classList.add('open');
const pg = stage.querySelector('.page-note'); if(pg){ void pg.offsetHeight; }

function flipTo(to){ const pager = document.querySelector('#card-root .pager'); if(pager) pager.classList.toggle('album', to === 'album'); }

function fireConfetti(colors){
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
const parts = [];
for(let i=0;i<90;i++){ parts.push({ x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*0.42, vx:(Math.random()-.5)*9, vy:-Math.random()*13-4, g:0.28+Math.random()*0.12, s:5+Math.random()*6, rot:Math.random()*6.28, vr:(Math.random()-.5)*0.3, c:colors[i%colors.length] }); }

const a = Math.max(0, 1 - el/2600); ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); }

}

function openLightbox(i){
const media = window.CARD.media; if(!media || !media.length) return;
window.__lbIndex = i;
let ov = document.getElementById('__lightbox');
if(!ov){ ov = document.createElement('div'); ov.id='__lightbox'; ov.className='lightbox'; document.body.appendChild(ov);

}

function renderLightbox(){
const ov = document.getElementById('__lightbox'); const media = window.CARD.media; const i = window.__lbIndex; const m = media[i];
const inner = m.type === 'photo' ? '<img src="'+m.src+'" alt="Photo">' : '<video src="'+m.src+'" controls autoplay playsinline></video>';
const nav = media.length > 1 ? '<button class="lb-btn lb-prev" aria-label="Previous">‹</button><button class="lb-btn lb-next" aria-label="Next">›</button><div class="lb-count">'+(i+1)+' / '+media.length+'</div>' : '';

function lbNav(dir){ const len = window.CARD.media.length; window.__lbIndex = (window.__lbIndex + dir + len) % len; renderLightbox(); }

function closeLightbox(){ const ov = document.getElementById('__lightbox'); if(ov){ const v = ov.querySelector('video'); if(v) v.pause(); ov.style.display='none'; ov.innerHTML=''; } }

function lbKey(e){ const ov = document.getElementById('__lightbox'); if(!ov || ov.style.display==='none') return; if(e.key==='Escape') closeLightbox(); else if(e.key==='ArrowRight') lbNav(1); else if(e.key==='ArrowLeft') lbNav(-1); }
